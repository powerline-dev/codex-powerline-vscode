name: Publish VS Code extension

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built VSIX packages to Visual Studio Marketplace
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check release version
        id: version
        shell: pwsh
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
        run: |
          $publish = $env:PUBLISH_REQUESTED -eq 'true'
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:BEFORE_SHA -notmatch '^0+$') {
            $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
            $previousPackage = git show "$($env:BEFORE_SHA):package.json"
            if ($LASTEXITCODE -ne 0) { throw 'Could not read the version before this push.' }
            $previousVersion = ($previousPackage | Out-String | ConvertFrom-Json).version
            if (!$version -or !$previousVersion) { throw 'Missing extension version.' }
            $publish = [version]$version -gt [version]$previousVersion
          }
          "publish=$($publish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  package:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: windows-2025
            target: win32-x64
          - runner: macos-15
            target: darwin-arm64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - name: Package the extension
        run: npm run package -- --target ${{ matrix.target }} --out codex-powerline-vscode-${{ matrix.target }}.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: vsix-${{ matrix.target }}
          path: codex-powerline-vscode-${{ matrix.target }}.vsix
          if-no-files-found: error

  publish:
    if: needs.release.outputs.publish == 'true' && github.repository == 'powerline-dev/codex-powerline-vscode' && github.ref == 'refs/heads/main'
    needs: [release, package]
    runs-on: ubuntu-latest
    environment: marketplace-release
    concurrency:
      group: marketplace-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          pattern: vsix-*
          merge-multiple: true
          path: artifacts
      - name: Publish both platforms
        shell: pwsh
        run: |
          $manifest = Get-Content package.json -Raw | ConvertFrom-Json
          $extensionId = "$($manifest.publisher).$($manifest.name)"
          $metadata = (npm exec -- vsce show $extensionId --json | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($metadata -ne 'undefined') {
            $extension = $metadata | ConvertFrom-Json
            if (!$extension.versions) { throw 'Marketplace did not return any version metadata.' }
            foreach ($release in $extension.versions) {
              if ([version]$release.version -gt [version]$manifest.version) {
                Write-Output "Skipping $($manifest.version) because $($release.version) is already on Marketplace."
                return
              }
            }
          }
          & npm exec -- vsce publish --oidc --skip-duplicate --packagePath `
            artifacts/codex-powerline-vscode-win32-x64.vsix `
            artifacts/codex-powerline-vscode-darwin-arm64.vsix
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
